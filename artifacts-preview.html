<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dedddb" />
    <title>POI Artifact Preview</title>
    <link rel="stylesheet" href="artifacts-preview.css" />
    <script src="artifacts-preview.js" defer></script>
  </head>
  <body>
    <header class="preview-header">
      <div>
        <p class="preview-header__label">Interactive portfolio study</p>
        <h1>POI artifacts</h1>
      </div>
      <a href="index.html?visit=return&amp;time=dusk" target="_blank" rel="noreferrer">
        Open full portfolio <span aria-hidden="true">↗</span>
      </a>
    </header>

    <main>
      <nav class="artifact-tabs" aria-label="Choose a point-of-interest artifact"></nav>

      <section class="artifact-view" aria-labelledby="artifact-title">
        <div class="artifact-stage">
          <iframe
            id="artifact-frame"
            title="Live portfolio artifact preview"
            src="index.html?visit=return&amp;time=dusk"
          ></iframe>
          <div class="artifact-loading" role="status">Preparing the world…</div>
        </div>

        <aside class="artifact-inspector">
          <div class="artifact-inspector__heading">
            <p id="artifact-place"></p>
            <h2 id="artifact-title"></h2>
            <p id="artifact-description"></p>
          </div>

          <div>
            <p class="artifact-inspector__label">Idle animations</p>
            <div class="artifact-actions" role="group" aria-label="Preview idle animations"></div>
          </div>

          <p class="artifact-hint">
            Choose an animation to replay it. Keys <kbd>1</kbd>–<kbd>5</kbd> trigger the five idles;
            arrow keys move between artifacts.
          </p>
        </aside>
      </section>
    </main>
  </body>
</html>
