<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e4e4e2" />
    <title>Site-native Entrance Variants</title>
    <link rel="stylesheet" href="entrances-preview.css" />
    <script src="entrances-preview.js" defer></script>
  </head>
  <body>
    <header class="preview-bar">
      <div class="preview-title">
        <strong>Entrance variants</strong>
        <span>Actual site render</span>
      </div>

      <nav class="preview-tabs" aria-label="Choose an entrance variant">
        <button type="button" data-weather="clear" aria-selected="true">Clear</button>
        <button type="button" data-weather="rain" aria-selected="false">Rain</button>
        <button type="button" data-weather="wind" aria-selected="false">Wind</button>
        <button type="button" data-weather="snow" aria-selected="false">Snow</button>
      </nav>

      <div class="preview-actions">
        <button class="replay" type="button" aria-label="Replay entrance">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 6v4h-4M3.5 14v-4h4"/><path d="M5.2 6.5A6 6 0 0 1 15.5 6M14.8 13.5A6 6 0 0 1 4.5 14"/></svg>
          <span>Replay</span>
        </button>
        <a class="open-site" href="index.html?visit=return&amp;time=day&amp;entrancePreview=clear" target="_blank" rel="noreferrer">
          Open full-size
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M6 4h6v6" /></svg>
        </a>
      </div>
    </header>

    <main class="site-preview">
      <iframe
        id="site-frame"
        title="Live site entrance preview"
        src="index.html?visit=return&amp;time=day&amp;entrancePreview=clear"
      ></iframe>
      <div class="preview-loading" role="status">Loading the actual portfolio…</div>
    </main>
  </body>
</html>
